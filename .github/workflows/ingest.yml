name: Daily ingest

# Runs the real pipeline against the live API every morning (07:00 IST)
# and on demand. Output is uploaded as a build artifact.
# Airflow takes over scheduling in week 2.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to ingest (YYYY-MM-DD). Leave empty for yesterday (IST)."
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . tabulate
      - name: Ingest
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m aqp.ingest --date "${{ github.event.inputs.date }}"
          else
            python -m aqp.ingest
          fi
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import pandas as pd
          files = sorted(Path("data/bronze").rglob("*.parquet"))
          if not files:
              print("### No bronze data written")
          for f in files:
              df = pd.read_parquet(f)
              print(f"### {f.parent.name}: {len(df)} rows")
              summary = (df.groupby("city")
                           .agg(hours=("observed_at", "count"),
                                avg_pm2_5=("pm2_5", "mean"),
                                max_us_aqi=("us_aqi", "max"))
                           .round(1).reset_index())
              print(summary.to_markdown(index=False))
          EOF
      - name: Upload data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: air-quality-${{ github.run_id }}
          path: data/
          retention-days: 14
          if-no-files-found: warn
